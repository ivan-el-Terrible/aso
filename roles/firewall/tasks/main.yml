---
- name: Preparar reglas de acceso para SSH y FTP
  ansible.builtin.import_tasks: rules.yml

# Las reglas permanentes se aplican antes de iniciar firewalld; si ya estaba
# activo, immediate=true también las aplica al estado actual.
- name: Habilitar e iniciar firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
