---
- name: Permitir el puerto SSH y los puertos de FTP en la zona configurada
  ansible.posix.firewalld:
    zone: "{{ ftp_firewall_zone }}"
    port: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
    offline: true
  loop:
    - "{{ ftp_firewall_ssh_port }}/tcp"
    - "{{ ftp_firewall_control_port }}/tcp"
    - "{{ ftp_firewall_passive_ports }}/tcp"

- name: Permitir Samba en la misma zona del nodo
  ansible.posix.firewalld:
    zone: "{{ ftp_firewall_zone }}"
    service: samba
    state: enabled
    permanent: true
    immediate: true
    offline: true

- name: Permitir HTTP para Apache y phpMyAdmin en la zona del nodo
  ansible.posix.firewalld:
    zone: "{{ ftp_firewall_zone }}"
    service: http
    state: enabled
    permanent: true
    immediate: true
    offline: true

- name: Permitir PostgreSQL desde las redes IPv4 configuradas
  ansible.posix.firewalld:
    zone: "{{ ftp_firewall_zone }}"
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ postgresql_port }}" protocol="tcp" accept'
    state: enabled
    permanent: true
    immediate: true
    offline: true
  loop: "{{ postgresql_allowed_cidrs }}"
