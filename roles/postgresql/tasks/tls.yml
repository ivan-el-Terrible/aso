# TLS de PostgreSQL.
---
- name: Asegurar que OpenSSL este instalado
  package:
    name: openssl
    state: present

- name: Generar certificado y llave privada autofirmados para PostgreSQL
  command: >
    openssl req -new -x509 -days 365 -nodes
    -out /var/lib/pgsql/data/server.crt
    -keyout /var/lib/pgsql/data/server.key
    -subj "/CN=localhost"
  args:
    creates: /var/lib/pgsql/data/server.crt
  notify: Restart PostgreSQL

- name: Configurar permisos estrictos en server.crt y server.key
  file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop:
    - /var/lib/pgsql/data/server.crt
    - /var/lib/pgsql/data/server.key
  notify: Restart PostgreSQL
