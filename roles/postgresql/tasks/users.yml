---
- name: Asegurar la cuenta superusuaria PostgreSQL propietaria de la base
  community.postgresql.postgresql_user:
    name: "{{ postgresql_app_user }}"
    password: "{{ postgresql_app_password }}"
    role_attr_flags: LOGIN,SUPERUSER
    state: present
    login_user: postgres
    login_db: postgres
  become_user: postgres
  no_log: true
