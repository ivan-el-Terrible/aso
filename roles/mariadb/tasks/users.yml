---
- name: Asegurar la cuenta SQL de la aplicación
  community.mysql.mysql_user:
    name: "{{ mariadb_app_user }}"
    host: localhost
    password: "{{ mariadb_app_password }}"
    priv: "{{ mariadb_database }}.*:ALL"
    state: present
    login_user: root
    login_unix_socket: "{{ mariadb_socket }}"
    config_file: ''
  no_log: true
