---
- name: Registrar la clave SSH verificada de los destinos en el controlador
  hosts: destinos
  connection: local
  become: false
  gather_facts: false
  tags: ssh_host_key
  tasks:
    - name: Comprobar y registrar la clave SSH del destino
      ansible.builtin.import_role:
        name: preflight
        tasks_from: ssh_host_key

- name: Configurar FTP, Samba, LAMP y PostgreSQL en openSUSE Leap 16.0
  hosts: destinos
  become: true
  gather_facts: true
  tags: deploy
  pre_tasks:
    - name: Comprobar que la contraseña compartida esté cifrada y disponible
      ansible.builtin.assert:
        that:
          - publica_password is defined
          - publica_password | length > 0
        fail_msg: Define publica_password con Ansible Vault en group_vars/destinos.yml.
      no_log: true

    - name: Derivar el hash Linux desde la contraseña cifrada de publica
      ansible.builtin.command:
        argv:
          - openssl
          - passwd
          - -6
          - -salt
          - "{{ accounts_publica_password_salt }}"
          - -stdin
        stdin: "{{ publica_password }}"
      delegate_to: localhost
      become: false
      register: accounts_publica_hash_result
      changed_when: false
      no_log: true

    - name: Compartir el hash Linux con el rol accounts
      ansible.builtin.set_fact:
        accounts_publica_password_hash: "{{ accounts_publica_hash_result.stdout }}"
      no_log: true
  roles:
    - preflight
    - packages
    - accounts
    - ftp
    - samba
    - apache_php
    - mariadb
    - phpmyadmin
    - postgresql
    - firewall
    - verify
