---
- name: Registrar la clave SSH verificada de los destinos en el controlador
  hosts: destinos
  connection: local
  become: false
  gather_facts: false
  tags: ssh_host_key
  tasks:
    - name: Comprobar y registrar la clave SSH del destino
      ansible.builtin.import_role:
        name: preflight
        tasks_from: ssh_host_key

- name: Configurar cuentas, FTP y Samba en openSUSE Leap 16.0
  hosts: destinos
  become: true
  gather_facts: true
  tags: deploy
  roles:
    - preflight
    - packages
    - accounts
    - ftp
    - samba
    - firewall
    - verify

# Los demás roles del proyecto siguen pendientes de implementación.
